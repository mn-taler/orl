<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Open Random Link</title>
  <link rel="icon" href="icons/icon128.png" type="image/png" sizes="128x128">
  <meta name="theme-color" content="#1a2c22">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <script>
    (function () {
      var stored = localStorage.getItem('darkMode');
      var dark = stored === 'true' || (
        stored !== 'false' && (
          !window.matchMedia ||
          !window.matchMedia('(prefers-color-scheme: light)').matches
        )
      );
      document.documentElement.classList.toggle('dark', dark);
      document.querySelector('meta[name="theme-color"]').content = dark ? '#1a2c22' : '#e4f6e9';
    })();
  </script>
</head>
<body>
  <div class="page">
    <div class="container">
      <header class="header">
        <h1>
          <img src="icons/icon128.png" alt="" class="header-icon" />
          OPEN RANDOM LINK
        </h1>
        <div class="settings">
          <button type="button" id="settings-button" class="settings-button" aria-label="Settings" aria-expanded="false" aria-haspopup="true" aria-controls="settings-menu">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
          </button>
          <div id="settings-menu" class="settings-menu" role="menu" hidden>
            <button type="button" id="import-link" class="settings-item" role="menuitem">Import JSON</button>
            <button type="button" id="export-link" class="settings-item" role="menuitem">Export JSON</button>
            <label class="settings-item settings-toggle" role="menuitemcheckbox" aria-checked="false">
              <input type="checkbox" id="dark-mode" />
              <span>Dark mode</span>
            </label>
          </div>
        </div>
      </header>
      <p>Open random links from your personal link collection.</p>
      <section class="glass-panel open-section">
        <button type="button" id="open-button">OPEN</button>
        <section class="options-section">
          <button type="button" id="options-toggle" class="options-toggle" aria-expanded="false" aria-controls="options-panel">
            <svg class="options-arrow" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
            <span>Options</span>
          </button>
          <div id="options-panel" class="options-panel" hidden>
            <label class="options-row" for="link-amount">
              <span class="options-row-label">Amount of links</span>
              <span class="options-row-hint">select 1-10</span>
              <input type="number" id="link-amount" min="1" max="10" step="1" value="1" inputmode="numeric" aria-label="Amount of links" />
            </label>
            <label class="options-row" for="open-group">
              <span class="options-row-label">Group</span>
              <select id="open-group" aria-label="Group to open from">
                <option value="">All</option>
              </select>
            </label>
            <div class="options-row">
              <span class="options-row-label" id="open-tag-label">Tags</span>
              <div class="tag-select">
                <input type="hidden" id="open-tag" value="" />
                <button type="button" id="open-tag-toggle" class="tag-select-toggle" aria-haspopup="listbox" aria-expanded="false" aria-controls="open-tag-menu" aria-labelledby="open-tag-label">
                  All
                </button>
                <div id="open-tag-menu" class="tag-select-menu" role="listbox" aria-multiselectable="true" hidden></div>
              </div>
            </div>
          </div>
        </section>
      </section>

      <section class="glass-panel add-section">
        <div class="add-link">
          <input type="url" id="link-input" placeholder="https://…" />
          <button type="button" id="add-link-button">ADD</button>
        </div>
        <section class="options-section">
          <button type="button" id="link-info-toggle" class="options-toggle" aria-expanded="false" aria-controls="link-info-panel">
            <svg class="options-arrow" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
            <span>Details</span>
          </button>
          <div id="link-info-panel" class="options-panel" hidden>
            <label class="options-row" for="link-group">
              <span class="options-row-label">Group</span>
              <input type="text" id="link-group" list="group-suggestions" placeholder="Main" autocomplete="off" />
            </label>
            <label class="options-row" for="link-name">
              <span class="options-row-label">Name</span>
              <input type="text" id="link-name" placeholder="Name" autocomplete="off" />
            </label>
            <div class="options-row">
              <label class="options-row-label" for="tag-input">Tags</label>
              <input type="text" id="tag-input" maxlength="128" placeholder="Tag" autocomplete="off" spellcheck="false" />
              <button type="button" id="add-tag-button" class="options-add-button">ADD</button>
            </div>
            <div id="draft-tag-list" class="tag-field" hidden></div>
            <p id="tag-editor-error" class="tag-editor-error" aria-live="polite"></p>
            <datalist id="group-suggestions"></datalist>
          </div>
        </section>
      </section>

      <section class="glass-panel link-collection-section">
        <div class="link-collection">
          <h2>COLLECTION</h2>
          <p id="list-info" class="list-info" aria-live="polite">No links saved yet.</p>
        </div>
        <ul id="link-list"></ul>
      </section>

      <input type="file" id="import-file" accept=".json,application/json" hidden />
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
